<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-light: rgba(99, 102, 241, 0.1);
            --user-bubble: #6366f1;
            --bot-bubble: #1e293b;
            --danger: #ef4444;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.875rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }
        .logo {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.1rem; color: white;
        }
        .header-text h1 { font-size: 1.05rem; font-weight: 600; }
        .header-text p { font-size: 0.75rem; color: var(--text-muted); }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; margin-left: 0;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        /* ── Layout mode toggle ─────────────────────────── */
        .mode-toggle {
            margin-left: auto;
            margin-right: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }
        .mode-toggle:hover {
            border-color: var(--accent);
            color: var(--accent-hover);
        }
        .mode-toggle svg { width: 16px; height: 16px; }

        /* ── Chat area ──────────────────────────────────── */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }
        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .msg {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            animation: fadeIn 0.3s ease;
        }
        .msg.user { align-self: flex-end; align-items: flex-end; }
        .msg.bot { align-self: flex-start; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .bubble {
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 0.9rem;
        }
        .msg.user .bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.bot .bubble {
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .bubble p { margin-bottom: 0.5rem; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble ul, .bubble ol { padding-left: 1.25rem; margin-bottom: 0.5rem; }
        .bubble li { margin-bottom: 0.25rem; }
        .bubble strong { color: var(--accent-hover); }
        .bubble code {
            background: rgba(0,0,0,0.3);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-size: 0.85em;
        }

        /* ── Typing indicator ────────────────────────────── */
        .typing { display: flex; gap: 4px; padding: 0.75rem 1rem; }
        .typing span {
            width: 8px; height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ── Welcome screen ──────────────────────────────── */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 1rem;
            padding: 2rem;
        }
        .welcome .logo-big {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.8rem; color: white;
        }
        .welcome h2 { font-size: 1.4rem; font-weight: 600; }
        .welcome p { color: var(--text-muted); max-width: 400px; }
        .suggestions {
            display: flex; flex-wrap: wrap; gap: 0.5rem;
            justify-content: center; margin-top: 0.5rem;
        }
        .suggestion-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .suggestion-chip:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent-hover);
        }

        /* ── Input bar ───────────────────────────────────── */
        .input-bar {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 1rem 1.5rem;
            flex-shrink: 0;
        }
        .input-wrap {
            display: flex;
            gap: 0.75rem;
            max-width: 900px;
            margin: 0 auto;
        }
        #input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        #input:focus { border-color: var(--accent); }
        #input::placeholder { color: var(--text-muted); }
        #send {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        #send:hover { background: var(--accent-hover); }
        #send:disabled { opacity: 0.5; cursor: not-allowed; }
        #send svg { width: 18px; height: 18px; }

        .error-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        /* ── App wrapper ─────────────────────────────────── */
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* ── Widget (corner) mode ─────────────────────────── */
        body.widget-mode {
            background: #ffffff;
            overflow: visible;
        }
        body.widget-mode #app {
            position: fixed;
            right: 20px;
            bottom: 90px;
            width: 380px;
            height: 560px;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 120px);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            background: #000000;
            display: none;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        body.widget-mode.open #app {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        body.widget-mode header {
            background: linear-gradient(135deg, var(--accent), #a855f7);
        }
        body.widget-mode .header-text h1 { color: white; }
        body.widget-mode .header-text p { color: rgba(255,255,255,0.8); }
        body.widget-mode .mode-toggle {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            color: white;
        }
        body.widget-mode .mode-toggle:hover {
            background: rgba(255,255,255,0.25);
            color: white;
        }

        #widget-bubble {
            display: none;
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            z-index: 2147483000;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        body.widget-mode #widget-bubble { display: flex; }
        #widget-bubble:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 28px rgba(99, 102, 241, 0.55);
        }
        #widget-bubble svg { width: 28px; height: 28px; }
        #widget-bubble .chat-icon { fill: white; }
        #widget-bubble .close-icon { stroke: white; display: none; }
        body.widget-mode.open #widget-bubble .chat-icon { display: none; }
        body.widget-mode.open #widget-bubble .close-icon { display: block; }

        @media (max-width: 480px) {
            body.widget-mode #app {
                right: 0; left: 0; bottom: 0;
                width: 100vw; height: 100vh;
                border-radius: 0;
                max-width: 100%; max-height: 100%;
            }
            body.widget-mode #widget-bubble { right: 16px; bottom: 16px; }
        }
    </style>
</head>
<body>

<div id="app">
<header>
    <div class="logo">S</div>
    <div class="header-text">
        <h1>SafePay Assistant</h1>
        <p>Ask me anything about SafePay</p>
    </div>
    <button id="mode-toggle" class="mode-toggle" onclick="toggleMode()" title="Switch between full page and corner widget">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <span id="mode-label">Widget</span>
    </button>
    <div class="status-dot" title="Online"></div>
</header>

<div id="chat">
    <div class="welcome" id="welcome">
        <div class="logo-big">S</div>
        <h2>Welcome to SafePay Assistant</h2>
        <p>I can answer questions about SafePay's products, features, integrations, pricing, and developer documentation.</p>
        <div class="suggestions">
            <div class="suggestion-chip" onclick="useSuggestion('What is SafePay?')">What is SafePay?</div>
            <div class="suggestion-chip" onclick="useSuggestion('How do I integrate SafePay with Shopify?')">Shopify integration</div>
            <div class="suggestion-chip" onclick="useSuggestion('What is Payment Orchestration?')">Payment Orchestration</div>
            <div class="suggestion-chip" onclick="useSuggestion('What are SafePay Atoms?')">SafePay Atoms</div>
            <div class="suggestion-chip" onclick="useSuggestion('How do payment links work?')">Payment Links</div>
        </div>
    </div>
</div>

<div class="input-bar">
    <div class="input-wrap">
        <input id="input" type="text" placeholder="Type your question..." autocomplete="off" />
        <button id="send" onclick="send()">
            Send
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>
</div>

<div id="widget-bubble" onclick="togglePanel()" title="SafePay Assistant">
    <svg class="chat-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.6 1.3 4.9 3.4 6.5-.1 1-.5 2.4-1.6 3.3 1.9-.1 3.4-.8 4.4-1.4 1.2.3 2.4.5 3.8.5 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"></path>
    </svg>
    <svg class="close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
</div>

<script>
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const chat = document.getElementById('chat');
    const welcome = document.getElementById('welcome');
    let loading = false;

    // Unique session id so the backend can keep per-conversation memory
    const sessionId = (crypto.randomUUID && crypto.randomUUID()) ||
        'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2);

    // ── Layout mode toggle (full page ↔ corner widget) ──
    function toggleMode() {
        const body = document.body;
        const isWidget = body.classList.toggle('widget-mode');
        document.getElementById('mode-label').textContent = isWidget ? 'Full page' : 'Widget';
        if (isWidget) {
            body.classList.add('open');
        } else {
            body.classList.remove('open');
        }
        input.focus();
    }

    function togglePanel() {
        const body = document.body;
        body.classList.toggle('open');
        if (body.classList.contains('open')) input.focus();
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !loading) send(); });

    function useSuggestion(text) {
        input.value = text;
        send();
    }

    function scrollToBottom() {
        chat.scrollTop = chat.scrollHeight;
    }

    function addMessage(role, content) {
        // Remove welcome screen on first message
        if (welcome) welcome.remove();

        const msg = document.createElement('div');
        msg.className = `msg ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'bot') {
            bubble.innerHTML = marked.parse(content);
        } else {
            bubble.textContent = content;
        }
        msg.appendChild(bubble);

        chat.appendChild(msg);
        scrollToBottom();
        return msg;
    }

    function addTypingIndicator() {
        const msg = document.createElement('div');
        msg.className = 'msg bot';
        msg.id = 'typing-msg';
        const typing = document.createElement('div');
        typing.className = 'typing bubble';
        typing.innerHTML = '<span></span><span></span><span></span>';
        msg.appendChild(typing);
        chat.appendChild(msg);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const t = document.getElementById('typing-msg');
        if (t) t.remove();
    }

    async function send() {
        const question = input.value.trim();
        if (!question || loading) return;

        loading = true;
        sendBtn.disabled = true;
        input.value = '';

        addMessage('user', question);
        addTypingIndicator();

        try {
            const res = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, session_id: sessionId }),
            });
            const data = await res.json();

            removeTypingIndicator();

            if (!res.ok) {
                addMessage('bot', `⚠️ **Error:** ${data.detail || 'Something went wrong. Please try again.'}`);
            } else {
                addMessage('bot', data.answer);
            }
        } catch (err) {
            removeTypingIndicator();
            addMessage('bot', '⚠️ **Connection error.** Please make sure the server is running and try again.');
        }

        loading = false;
        sendBtn.disabled = false;
        input.focus();
    }

    input.focus();
</script>

</body>
</html>
