# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: safepay-chatbot
    runtime: python
    region: singapore          # closest Render region to Pakistan
    plan: starter              # 512 MB; embeddings run on ONNX (no torch)
    branch: main
    autoDeployTrigger: commit
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python build_index.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false            # set in the Render dashboard, never commit it
      # Keep the embedding model (and the chroma_db index) inside the project dir:
      # only that dir carries over from build to runtime (~/.cache does not).
      - key: FASTEMBED_CACHE_PATH
        value: /opt/render/project/src/.model_cache
